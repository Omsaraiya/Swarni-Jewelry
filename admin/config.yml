backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

# FIXED: Pointing to your actual working website!
site_url: https://svarni-official.netlify.app
display_url: https://svarni-official.netlify.app
logo_url: https://svarni-official.netlify.app/images/logo.png

collections:
  - name: "database"
    label: "Database"
    files:
      - label: "Product List"
        name: "products"
        file: "data/products.json" 
        fields:
          - label: "All Products"
            name: "items"
            widget: "list"
            fields:
              - {label: "Product Name", name: "title", widget: "string"}
              - {label: "Price (₹)", name: "price", widget: "number"}
              
              # UPDATED: Her exact new categories for the dropdown
                    - label: "Category (Type any category here!)"
                      name: "category"
                      widget: "string"
                      hint: "Type your category exactly as you want it (e.g., necklace, rings, anklets)"

              
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Product Image", name: "image", widget: "image"}
              
              # UPDATED: Changed the hint so you remember to type Best Seller or Trending
              - {label: "Badge (Optional)", name: "badge", widget: "string", required: false, hint: "e.g. Best Seller, Trending"}
