<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svarni | Admin Dashboard</title>
  
  <link rel="icon" type="image/png" href="../images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* Forces the dashboard to use the modern font */
    body, #nc-root, [class*="nc-"] {
        font-family: 'Poppins', sans-serif !important;
    }

    /* Adds a premium Svarni Brown branding bar to the very top */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background-color: #4a3728; /* Svarni Brown */
        z-index: 999999;
    }

    /* Softens the background color of the login screen */
    body {
        background-color: #fdfbf7 !important; 
    }

    /* Styles the login box */
    #netlify-identity-widget {
        font-family: 'Poppins', sans-serif !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
